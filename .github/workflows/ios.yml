name: iOS

# Builds unsigned .ipa files for The First Encounter and The Second Encounter.
# Sideload them (e.g. with Signulous); copy your own game data in through the Files app.
#
# Where the .ipa files go:
#   - a push to ios, or a manual run with "release" left empty: both games to
#     the "ios-latest" prerelease, as always.
#   - a manual run of branch ios with "release" set to a tag such as ios-v0.1
#     (gh workflow run ios.yml --ref ios -f release=ios-v0.1): a release for
#     that tag, created at the commit being built, with ios/RELEASE_NOTES.md
#     from that commit as its text and only the games in RELEASE_IPAS
#     attached, marked as the latest release. A version with a '-' in it
#     (ios-v0.2-beta1) is a prerelease instead and isn't marked latest.
#     ios-latest is left alone. The run stops before building if the tag isn't
#     ios-v<version>, is already on another commit, or the notes have no
#     "### What's in <tag>" line.
#   Running it again for the same tag on the same commit updates that release.
#
# ANGLE (OpenGL ES on Metal, what gl4es draws with; Apple's OpenGL ES if it
# can't start) is built once with Chromium's tools and cached, as in the Jedi
# Knight port's workflow. The first run takes a long time; later runs restore
# it in seconds. To rebuild it, change ANGLE_REV or bump ANGLE_CACHE_VERSION.

on:
  push:
    branches: [ "ios" ]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Leave empty to update ios-latest as usual.
        required: false
        default: ''

concurrency:
  # Release runs for one tag go one at a time; a running one is never cancelled
  # (a newer one waits, replacing any run already waiting). Every other run has
  # a group of its own, so pushes run as before.
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # App Store Connect requires iOS 15 or later from April 2027.
  IOS_MIN: "15.0"
  SDL_TAG: release-2.30.8
  GL4ES_SHA: ec16bedd8819c475326f4f1a3063772c6d986e06
  # ANGLE branch chromium/8060, from the github.com/google/angle mirror (the
  # same revision as the Jedi Knight and Dark Forces ports)
  ANGLE_REV: 4b7308a36376199c095ccb0ab69b773daa8b9fbe
  ANGLE_CACHE_VERSION: v1
  # The iOS that ANGLE's frameworks need (as in those ports). An older iOS
  # can't load them, and the games use Apple's OpenGL ES there.
  ANGLE_IOS_MIN: "18.0"
  # The tag a manual run was asked to release; empty for pushes and ordinary runs.
  RELEASE_TAG: ${{ inputs.release }}
  # The .ipa files a release gets, space-separated: since ios-v0.2 both games
  # (serioussamse-ios.ipa is The Second Encounter, serioussam-ios.ipa The First
  # Encounter; ios-v0.1 had The Second Encounter only). To release one game
  # only, leave the other out and change RELEASE_TITLE to match. Every run
  # still builds both games, and ios-latest still gets both.
  RELEASE_IPAS: serioussamse-ios.ipa serioussam-ios.ipa
  # Release title; the tag's version is added after it (ios-v0.2 -> "... v0.2").
  RELEASE_TITLE: "Serious Sam Classic for iOS"

# Read-only by default; only the release job, which publishes, can write.
permissions:
  contents: read

jobs:
  angle:
    name: ANGLE
    runs-on: macos-15
    # the first (uncached) build is long
    timeout-minutes: 330
    steps:
    - name: Restore ANGLE
      id: angle
      uses: actions/cache/restore@v4
      with:
        path: angle-prebuilt
        key: angle-ios-arm64-${{ env.ANGLE_REV }}-ios${{ env.ANGLE_IOS_MIN }}-${{ env.ANGLE_CACHE_VERSION }}
        lookup-only: true

    - name: Select newest Xcode
      if: steps.angle.outputs.cache-hit != 'true'
      run: |
        set -e
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: Free disk space for ANGLE
      if: steps.angle.outputs.cache-hit != 'true'
      run: |
        df -h /
        sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet /usr/local/lib/node_modules || true
        df -h /

    - name: Build ANGLE
      if: steps.angle.outputs.cache-hit != 'true'
      run: |
        set -ex
        git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
        export PATH="$RUNNER_TEMP/depot_tools:$PATH"
        mkdir -p "$RUNNER_TEMP/angle" && cd "$RUNNER_TEMP/angle"
        git init -q
        git fetch --depth 1 https://github.com/google/angle "$ANGLE_REV"
        git checkout -q FETCH_HEAD
        # an unmanaged solution rooted at this checkout, for iOS, without
        # Dawn/WebGPU (not needed, and large)
        cat > .gclient <<'EOF'
        solutions = [
          {
            "name": ".",
            "url": "https://chromium.googlesource.com/angle/angle.git",
            "deps_file": "DEPS",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {
              "checkout_angle_dawn_deps": False,
            },
          },
        ]
        target_os = ["ios"]
        EOF
        gclient sync --no-history --shallow -j8
        df -h /
        gn gen out/ios --args="
          is_debug=false
          is_component_build=false
          symbol_level=0
          target_os=\"ios\"
          target_cpu=\"arm64\"
          target_environment=\"device\"
          ios_deployment_target=\"$ANGLE_IOS_MIN\"
          ios_enable_code_signing=false
          angle_enable_vulkan=false
          angle_enable_swiftshader=false
          angle_enable_wgpu=false
          angle_build_tests=false
        "
        autoninja -C out/ios libEGL libGLESv2
        # only what ios/ios_app.cmake needs: include/ and the two frameworks
        DEST="$GITHUB_WORKSPACE/angle-prebuilt"
        mkdir -p "$DEST/out/ios"
        cp -R include "$DEST/include"
        cp -R out/ios/libEGL.framework out/ios/libGLESv2.framework "$DEST/out/ios/"
        ls -la "$DEST/out/ios"/*.framework

    - name: Save ANGLE
      if: steps.angle.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: angle-prebuilt
        key: ${{ steps.angle.outputs.cache-primary-key }}

  build:
    name: ${{ matrix.game }}
    needs: angle
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: SamTFE
            internal: serioussam
          - game: SamTSE
            internal: serioussamse

    steps:
    - uses: actions/checkout@v4
      with:
        # the build steps don't need the token (git ls-remote of this public
        # repository works without it)
        persist-credentials: false

    # The runner's default Xcode is older than App Store Connect accepts (it
    # requires the iOS 26 SDK), so use the newest non-beta Xcode installed.
    - name: Select newest Xcode
      run: |
        set -e
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version

    # Before the build: a release needs a usable tag and notes written for it.
    - name: Check release tag and notes
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        case "$RELEASE_TAG" in
          ios-v*) ;;
          *) echo "::error::Release tag \"$RELEASE_TAG\" should look like ios-v0.1 (ios-v<version>)."; exit 1 ;;
        esac
        if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
          echo "::error::\"$RELEASE_TAG\" can't be a git tag name."
          exit 1
        fi
        # A tag already there must be on this commit, or the release's .ipa and
        # its tag's source would differ (publishing doesn't move a tag).
        REFS=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
        TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
        if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
          echo "::error::Tag $RELEASE_TAG is already on commit $TAGGED, not on $GITHUB_SHA (the commit this run builds). Pick a new tag."
          exit 1
        fi
        if ! grep -qxF "### What's in ${RELEASE_TAG}" ios/RELEASE_NOTES.md; then
          echo "::error file=ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG}, commit and push them, then run this again."
          exit 1
        fi

    - name: Host tools
      run: |
        brew install bison flex ninja
        echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

    - name: Restore iOS dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: deps
        key: ios-deps-${{ env.SDL_TAG }}-${{ env.GL4ES_SHA }}-${{ env.IOS_MIN }}-v1

    - name: Build SDL2 and gl4es for iOS
      if: steps.deps.outputs.cache-hit != 'true'
      run: ios/ci_run.sh "iOS dependencies" ios/build_deps.sh "$PWD/deps"

    - name: Save iOS dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true  # both games build them; only one save can win
      with:
        path: deps
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Restore ANGLE
      uses: actions/cache/restore@v4
      with:
        path: angle-prebuilt
        key: angle-ios-arm64-${{ env.ANGLE_REV }}-ios${{ env.ANGLE_IOS_MIN }}-${{ env.ANGLE_CACHE_VERSION }}
        fail-on-cache-miss: true

    - name: Show ANGLE
      run: |
        for f in libEGL libGLESv2; do
          file "angle-prebuilt/out/ios/$f.framework/$f"
          otool -l "angle-prebuilt/out/ios/$f.framework/$f" | grep -A4 LC_BUILD_VERSION | grep -E 'platform|minos' || true
        done

    - name: Build entity compiler (host)
      run: |
        set -e
        cd ${{ matrix.game }}/Sources
        bison -o Ecc/Parser.cpp Ecc/Parser.y -d
        cp Ecc/Parser.hpp Ecc/Parser.h
        flex -oEcc/Scanner.cpp Ecc/Scanner.l
        clang++ -O2 -std=gnu++14 -I. -DPLATFORM_UNIX=1 -DPRAGMA_ONCE=1 -fms-extensions -w \
          -o $RUNNER_TEMP/ecc Ecc/Main.cpp Ecc/Parser.cpp Ecc/Scanner.cpp

    - name: Configure
      run: |
        DEPS=$PWD/deps
        ios/ci_run.sh "Configure ${{ matrix.game }}" cmake -S ${{ matrix.game }}/Sources -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
          -DCMAKE_BUILD_TYPE=Release \
          -DECC=$RUNNER_TEMP/ecc \
          -DUSE_ASM=OFF \
          -DBUILD_DEDICATED_SERVER=OFF -DBUILD_MAKEFONT=OFF -DBUILD_TEXConv=OFF \
          -DSDL2_DIR=$DEPS/lib/cmake/SDL2 \
          -DSDL2_INCLUDE_DIR=$DEPS/include/SDL2 \
          -DSDL2_LIBRARY=$DEPS/lib/libSDL2.a \
          -DGL4ES_ROOT=$DEPS/gl4es \
          -DGL4ES_LIBRARY=$DEPS/gl4es/lib/libGL.a \
          -DANGLE_ROOT=$PWD/angle-prebuilt \
          -DSE_IOS_BUILD_NUMBER=${{ github.run_number }}

    - name: Build
      run: ios/ci_run.sh "Build ${{ matrix.game }}" cmake --build build -- -k 0

    - name: Package .ipa
      run: |
        set -e
        APP=$(find build -maxdepth 2 -name "*.app" -type d | head -1)
        echo "App bundle: $APP"
        ls -la "$APP"
        plutil -lint "$APP/Info.plist"
        # ANGLE is in the app (loaded at run time), Apple's OpenGL ES is still linked
        ls "$APP/Frameworks/libEGL.framework/libEGL" "$APP/Frameworks/libGLESv2.framework/libGLESv2"
        otool -L "$APP/$(basename "$APP" .app)" | grep OpenGLES
        # ANGLE's frameworks first, then the app around them
        for f in "$APP"/Frameworks/*.framework; do
          codesign --force --sign - --timestamp=none "$f"
        done
        codesign --force --sign - --timestamp=none "$APP"
        mkdir -p ipa/Payload
        cp -R "$APP" ipa/Payload/
        (cd ipa && zip -qry "../${{ matrix.internal }}-ios.ipa" Payload)
        ls -la *.ipa

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.internal }}-ios
        path: ${{ matrix.internal }}-ios.ipa

  release:
    name: ${{ inputs.release != '' && format('Publish release {0}', inputs.release) || 'Publish to "iOS latest" release' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Release runs only: the notes from the run's commit, for the release text.
    # Kept first, as checkout empties the folder it checks out into.
    - name: Get release notes
      if: env.RELEASE_TAG != ''
      uses: actions/checkout@v4
      with:
        sparse-checkout: ios/RELEASE_NOTES.md
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - uses: actions/download-artifact@v4
      with:
        path: out
        merge-multiple: true

    # Pushes and ordinary manual runs; a release run leaves ios-latest alone.
    - name: Publish to "ios-latest" release
      if: env.RELEASE_TAG == ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ios-latest
        name: iOS latest build
        prerelease: true
        make_latest: false
        body: |
          Development builds, rebuilt after every push to the `ios` branch (run ${{ github.run_number }}, commit ${{ github.sha }}). They may not have been tried yet. For the latest release and how to install it, see ${{ github.server_url }}/${{ github.repository }}/releases/latest
          serioussam-ios.ipa = The First Encounter, serioussamse-ios.ipa = The Second Encounter.
          Sideload one, then copy your own game data into Files > On My iPhone > Sam FE / Sam SE.
        files: out/*.ipa

    # Release runs: only the games in RELEASE_IPAS, the title and whether it's
    # a prerelease (a '-' in the version, after the "ios-").
    - name: Prepare release
      id: rel
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if ! grep -qxF "### What's in ${RELEASE_TAG}" ios/RELEASE_NOTES.md; then
          echo "::error file=ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line."
          exit 1
        fi
        mkdir release
        for ipa in $RELEASE_IPAS; do
          if [ ! -f "out/$ipa" ]; then
            echo "::error::$ipa (in RELEASE_IPAS) wasn't built."
            exit 1
          fi
          cp "out/$ipa" release/
        done
        ls -la release
        VERSION=${RELEASE_TAG#ios-}
        case "$VERSION" in
          *-*) PRERELEASE=true; LATEST=false ;;
          *) PRERELEASE=false; LATEST=true ;;
        esac
        echo "Release \"$RELEASE_TITLE $VERSION\", prerelease $PRERELEASE, latest $LATEST"
        {
          echo "name=$RELEASE_TITLE $VERSION"
          echo "prerelease=$PRERELEASE"
          echo "latest=$LATEST"
        } >> "$GITHUB_OUTPUT"

    - name: Publish release for the tag
      if: env.RELEASE_TAG != ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        # Creates the tag at the commit this run built (left out, GitHub would
        # put a new tag on the default branch, main)
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.rel.outputs.name }}
        body_path: ios/RELEASE_NOTES.md
        prerelease: ${{ steps.rel.outputs.prerelease }}
        make_latest: ${{ steps.rel.outputs.latest }}
        files: release/*.ipa
        fail_on_unmatched_files: true
